<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">TUSA Astana — business model</title>
  <desc id="description">A business model diagram showing visitor discovery, the TUSA event platform, organizer tools, revenue streams, and a growth loop.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#426c47"/><stop offset="1" stop-color="#31543a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#243529" flood-opacity=".08"/></filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#587b52"/></marker>
    <marker id="arrowCream" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#dce9d3"/></marker>
    <style>
      text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .eyebrow { fill:#65805d; font-size:15px; font-weight:800; letter-spacing:3px; }
      .heading { fill:#26372b; font-size:38px; font-weight:750; letter-spacing:-.8px; }
      .subhead { fill:#6e796f; font-size:17px; }
      .card-title { fill:#26372b; font-size:20px; font-weight:700; }
      .card-copy { fill:#68746a; font-size:15px; }
      .step { fill:#63825b; font-size:13px; font-weight:800; letter-spacing:1.4px; }
      .white-title { fill:#fff; font-size:28px; font-weight:750; }
      .white-copy { fill:#e0eadb; font-size:16px; }
      .pill-text { fill:#35573a; font-size:15px; font-weight:700; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f6f0"/>
  <circle cx="1495" cy="65" r="170" fill="#eaf0e3"/>
  <circle cx="84" cy="935" r="180" fill="#edf1e8"/>
  <text x="100" y="92" class="eyebrow">LOCAL EVENTS · ASTANA</text>
  <text x="100" y="150" class="heading">A city marketplace that grows with every event</text>
  <text x="100" y="184" class="subhead">One simple loop connects people, organizers, ticket sales, and local discovery.</text>

  <!-- Audience lane -->
  <g filter="url(#shadow)">
    <rect x="95" y="260" width="365" height="350" rx="22" fill="#ffffff" stroke="#e2e8de" stroke-width="2"/>
    <rect x="95" y="260" width="365" height="78" rx="22" fill="#eaf0e4"/>
    <path d="M95 316v22h365v-22" fill="#eaf0e4"/>
  </g>
  <circle cx="137" cy="299" r="18" fill="#55794e"/>
  <path d="M129 300h16m-7-7 7 7-7 7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="169" y="305" class="eyebrow">FOR VISITORS</text>
  <text x="128" y="385" class="step">01 · DISCOVER</text>
  <text x="128" y="416" class="card-title">Find what’s happening</text>
  <text x="128" y="443" class="card-copy">Explore curated local events by</text><text x="128" y="464" class="card-copy">mood, place, and budget.</text>
  <line x1="128" y1="487" x2="426" y2="487" stroke="#e8ece4"/>
  <text x="128" y="522" class="step">02 · TAKE PART</text>
  <text x="128" y="553" class="card-title">Book, attend, share</text>
  <text x="128" y="579" class="card-copy">Simple ticket flow, event details,</text><text x="128" y="600" class="card-copy">and reasons to come back.</text>

  <!-- Platform -->
  <g filter="url(#shadow)">
    <rect x="585" y="235" width="430" height="400" rx="28" fill="url(#hero)"/>
  </g>
  <circle cx="800" cy="302" r="34" fill="#ffffff" fill-opacity=".12"/>
  <path d="M786 303h28M800 289v28" stroke="#e6f0dd" stroke-width="3" stroke-linecap="round"/>
  <text x="800" y="370" text-anchor="middle" class="white-title">TUSA Astana</text>
  <text x="800" y="402" text-anchor="middle" class="white-copy">A trusted local event marketplace</text>
  <line x1="655" y1="434" x2="945" y2="434" stroke="#ffffff" stroke-opacity=".2"/>
  <rect x="654" y="458" width="292" height="44" rx="22" fill="#ffffff" fill-opacity=".11"/>
  <circle cx="680" cy="480" r="5" fill="#c4d6a7"/><text x="698" y="485" class="white-copy">Discovery + curated listings</text>
  <rect x="654" y="515" width="292" height="44" rx="22" fill="#ffffff" fill-opacity=".11"/>
  <circle cx="680" cy="537" r="5" fill="#c4d6a7"/><text x="698" y="542" class="white-copy">Moderation + verified details</text>
  <rect x="654" y="572" width="292" height="44" rx="22" fill="#ffffff" fill-opacity=".11"/>
  <circle cx="680" cy="594" r="5" fill="#c4d6a7"/><text x="698" y="599" class="white-copy">Telegram-friendly experience</text>

  <!-- Organizer lane -->
  <g filter="url(#shadow)">
    <rect x="1140" y="260" width="365" height="350" rx="22" fill="#ffffff" stroke="#e2e8de" stroke-width="2"/>
    <rect x="1140" y="260" width="365" height="78" rx="22" fill="#eaf0e4"/>
    <path d="M1140 316v22h365v-22" fill="#eaf0e4"/>
  </g>
  <circle cx="1182" cy="299" r="18" fill="#55794e"/>
  <path d="M1174 299h16m-7-7 7 7-7 7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1214" y="305" class="eyebrow">FOR ORGANIZERS</text>
  <text x="1173" y="385" class="step">01 · PUBLISH</text>
  <text x="1173" y="416" class="card-title">Create an event listing</text>
  <text x="1173" y="443" class="card-copy">Submit event details, venue,</text><text x="1173" y="464" class="card-copy">pricing, and ticket tiers.</text>
  <line x1="1173" y1="487" x2="1471" y2="487" stroke="#e8ece4"/>
  <text x="1173" y="522" class="step">02 · GROW</text>
  <text x="1173" y="553" class="card-title">Reach more guests</text>
  <text x="1173" y="579" class="card-copy">Build visibility, sell tickets,</text><text x="1173" y="600" class="card-copy">and grow a local audience.</text>

  <!-- Flows -->
  <path d="M460 405 C510 405 530 405 575 405" fill="none" stroke="#587b52" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1025 405 C1070 405 1090 405 1130 405" fill="none" stroke="#587b52" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1140 645 C1095 700 1015 720 930 720" fill="none" stroke="#78936c" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M670 720 C570 720 480 695 425 620" fill="none" stroke="#78936c" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Revenue row -->
  <text x="100" y="710" class="eyebrow">SUSTAINABLE REVENUE</text>
  <text x="100" y="750" class="heading" style="font-size:25px">Monetize as the local network grows</text>
  <g filter="url(#shadow)">
    <rect x="100" y="785" width="390" height="105" rx="18" fill="#ffffff" stroke="#e2e8de" stroke-width="2"/>
    <rect x="530" y="785" width="390" height="105" rx="18" fill="#ffffff" stroke="#e2e8de" stroke-width="2"/>
    <rect x="960" y="785" width="390" height="105" rx="18" fill="#ffffff" stroke="#e2e8de" stroke-width="2"/>
    <rect x="1380" y="785" width="120" height="105" rx="18" fill="#e7eee2" stroke="#d8e3d2" stroke-width="2"/>
  </g>
  <circle cx="142" cy="837" r="20" fill="#eaf0e4"/><text x="142" y="844" text-anchor="middle" fill="#4f754d" font-size="19" font-weight="800">%</text>
  <text x="178" y="833" class="card-title">Ticket service fees</text><text x="178" y="859" class="card-copy">Revenue aligned with successful sales</text>
  <circle cx="572" cy="837" r="20" fill="#eaf0e4"/><path d="M564 842h16m-13-9h10m-7-5h4" stroke="#4f754d" stroke-width="2" stroke-linecap="round"/>
  <text x="608" y="833" class="card-title">Organizer plans</text><text x="608" y="859" class="card-copy">Recurring tools and visibility options</text>
  <circle cx="1002" cy="837" r="20" fill="#eaf0e4"/><path d="M992 840l10-10 10 10v8h-20z" fill="none" stroke="#4f754d" stroke-width="2" stroke-linejoin="round"/>
  <text x="1038" y="833" class="card-title">Promoted placements</text><text x="1038" y="859" class="card-copy">Sponsored reach for selected events</text>
  <text x="1440" y="829" text-anchor="middle" class="step">REINVEST</text><text x="1440" y="854" text-anchor="middle" fill="#496d46" font-size="14" font-weight="700">Product</text><text x="1440" y="875" text-anchor="middle" fill="#496d46" font-size="14" font-weight="700">+ growth</text>
  <path d="M1350 837h20" stroke="#587b52" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="100" y="945" fill="#7b857b" font-size="14">TUSA Astana · Business model overview</text>
  <text x="1500" y="945" text-anchor="end" fill="#7b857b" font-size="14">LOCAL DISCOVERY → REAL-WORLD CONNECTION</text>
</svg>
